name: Commit subjects

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    branches: ['**']

permissions: {}

jobs:
  format:
    name: ${{ github.event_name == 'push' && 'Check pushed commit subjects' || 'Check pull request commit subjects' }}
    if: ${{ !github.event.repository.private && !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Check subjects from the event
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          ZERO_SHA = "0" * 40
          SHA = re.compile(r"[0-9a-f]{40}")
          MAX_SUBJECT_LENGTH = 100
          MERGE_TITLE = re.compile(r"^Merge\b", re.IGNORECASE)
          MERGE_SHA = re.compile(r"\b[0-9a-f]{7,40}\b", re.IGNORECASE)
          CONVENTIONAL_PREFIX = re.compile(
              r"^(build|chore|ci|docs|feat|feature|fix|perf|refactor|release|revert|style|test)"
              r"(?:\([^()]+\))?!?:",
              re.IGNORECASE,
          )
          AUTOSQUASH_PREFIX = re.compile(r"^(fixup|squash|amend)!(?:\s|$)", re.IGNORECASE)

          def git(*args):
              return subprocess.check_output(
                  ["git", *args], cwd=work, encoding="utf-8", errors="replace"
              )

          def sha(value):
              if not SHA.fullmatch(value) or value == ZERO_SHA:
                  raise SystemExit("Cannot determine the commit indicated by the event.")
              return value

          def fetch(*refspecs):
              git("fetch", "--quiet", "--no-tags", "--no-write-fetch-head",
                  "--filter=tree:0", "origin", *refspecs)

          def check(label, subject, *, is_merge=False):
              title = re.sub(r" \(#[0-9]+\)$", "", subject)
              reasons = []
              if CONVENTIONAL_PREFIX.match(title):
                  reasons.append("omit the Conventional Commits prefix")
              elif AUTOSQUASH_PREFIX.match(title):
                  reasons.append("complete the autosquash before publishing")
              elif not re.match(r"^[A-Z]", title):
                  reasons.append("start with an uppercase English letter")
              elif title.rstrip().endswith("."):
                  reasons.append("omit the final period")
              if len(subject) > MAX_SUBJECT_LENGTH:
                  reasons.append(f"limit the subject to {MAX_SUBJECT_LENGTH} characters")
              if (is_merge or MERGE_TITLE.match(title)) and MERGE_SHA.search(title):
                  reasons.append("omit commit SHAs from merge subjects")
              for reason in reasons:
                  print(f"{label}: {reason}: {json.dumps(subject)}")
              return not reasons

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          kind = os.environ["GITHUB_EVENT_NAME"]
          valid = True
          with tempfile.TemporaryDirectory(prefix="commit-subjects-") as work:
              git("init", "--quiet")
              server = os.environ["GITHUB_SERVER_URL"]
              repository = os.environ["GITHUB_REPOSITORY"]
              git("remote", "add", "origin", f"{server}/{repository}.git")

              if kind == "pull_request":
                  pr = event["pull_request"]
                  before = sha(pr["base"]["sha"])
                  after = sha(pr["head"]["sha"])
                  fetch(before, after)
                  revision = [f"{before}..{after}"]
                  valid = check("Pull request title", pr["title"])
              elif kind == "push":
                  branch = event["ref"]
                  if not branch.startswith("refs/heads/") or event["deleted"]:
                      raise SystemExit(0)
                  after = sha(event["after"])
                  if event["before"] == ZERO_SHA:
                      git("check-ref-format", branch)
                      fetch(after)
                      fetch("+refs/heads/*:refs/published/heads/*",
                            "+refs/tags/*:refs/published/tags/*", f"^{branch}")
                      revision = [after, "--not", "--all"]
                  else:
                      before = sha(event["before"])
                      fetch(before, after)
                      revision = [f"{before}..{after}"]
              else:
                  raise SystemExit(f"Unsupported event: {kind}")

              subjects = git("log", "-z", "--format=%H%x09%P%x09%s", *revision, "--")
              entries = subjects.split("\0")[:-1]
              for entry in entries:
                  commit, parents, subject = entry.split("\t", 2)
                  if not check(commit[:12], subject, is_merge=len(parents.split()) > 1):
                      valid = False
              print(f"Checked {len(entries)} commit subject(s).")

          raise SystemExit(0 if valid else 1)
          PY
